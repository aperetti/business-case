[project]
name = "bca-backend"
version = "0.1.0"
description = "Cross-Domain Value Stream & Monte Carlo BCA Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "polars>=1.12.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
